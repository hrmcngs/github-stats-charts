name: Update usage counter

# "Use this template" 以外の利用も含めて使用数を集計し .usage.json を更新する。
# README の shields.io endpoint バッジが参照する JSON を生成。

on:
  schedule:
    - cron: '0 6 * * *'        # 1日1回（06:00 UTC ≒ 15:00 JST）
  workflow_dispatch:            # 手動実行
  push:
    branches: [main]
    paths-ignore:
      - '.usage.json'           # 自分自身の commit では走らない
      - 'charts/**'             # チャート更新では走らない

permissions:
  contents: write

concurrency:
  group: usage-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Count usage
        run: node scripts/count-usage.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git add .usage.json
          if git diff --cached --quiet; then
            echo "usage に変化なし — コミットしません。"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update usage counter [skip ci]"
            git push
          fi
