name: Update usage counter

# "Use this template" 以外の利用も含めて使用数を集計し .usage.json を更新する。
# README 用のローカルSVGバッジと .usage.json を生成。

on:
  schedule:
    - cron: '0 6 * * *'        # 1日1回（06:00 UTC ≒ 15:00 JST）
  workflow_dispatch:            # 手動実行
  push:
    branches: [main]
    paths-ignore:
      - '.usage.json'           # 自分自身の commit では走らない
      - 'badges/**'
      - 'charts/**'             # チャート更新では走らない

permissions:
  contents: write

concurrency:
  group: usage-counter
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Count usage
        run: node scripts/count-usage.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add .usage.json badges
          if git diff --cached --quiet; then
            echo "usage に変化なし — コミットしません。"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update usage counter [skip ci]"
            # 別の更新ジョブが先にpushしても、その変更を保持して再試行する。
            for attempt in 1 2 3 4; do
              git fetch origin "$TARGET_BRANCH"
              git rebase FETCH_HEAD
              if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
                exit 0
              fi
            done
            echo "リモート更新の競合でpushできませんでした。" >&2
            exit 1
          fi
