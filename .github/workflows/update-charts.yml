name: Update chart SVGs

# powered by https://github.com/hrmcngs/github-stats-charts
#
# GitHub統計チャートを SVG として生成し charts/ に出力する。
# .md にはこの SVG を画像として埋め込む（Markdown は JS が動かないため）。
# 内容に変化があったときだけコミットする。

on:
  push:
    branches: [main]
    paths:
      - 'src/js/charts.js'
      - 'scripts/gen-charts.js'
      - 'scripts/sync-upstream.js'
      - '.github/workflows/update-charts.yml'
  schedule:
    - cron: '0 */12 * * *'   # 12時間ごと
  workflow_dispatch:          # 手動実行（Actions タブから）

permissions:
  contents: write

concurrency:
  group: update-charts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update shared chart code (installed repositories)
        if: github.repository != 'hrmcngs/github-stats-charts'
        run: node scripts/sync-upstream.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate chart SVGs
        run: node scripts/gen-charts.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit charts if changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add charts scripts src/js
          if git diff --cached --quiet; then
            echo "チャートに変化なし — コミットしません。"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update chart SVGs [skip ci]"
            # 使用数更新やユーザーのpushと競合しても、先行した変更を取り込む。
            for attempt in 1 2 3 4; do
              git fetch origin "$TARGET_BRANCH"
              git rebase FETCH_HEAD
              if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then
                exit 0
              fi
            done
            echo "リモート更新の競合でpushできませんでした。" >&2
            exit 1
          fi
