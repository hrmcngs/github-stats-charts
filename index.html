<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Stats Charts — example</title>
  <style>
    body {
      background: #0d1117; color: #e6edf3; margin: 0; padding: 3rem 1rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1rem; font-weight: 600; color: #7d8590; margin: 0 0 1.6rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GitHub Stats Charts — example</h1>

    <!-- data-github-user を自分の GitHub ユーザー名に変更してください -->
    <div data-github-user="octocat"></div>
  </div>

  <!-- charts.js を先に読み込むこと -->
  <script src="src/js/charts.js"></script>
  <script src="src/js/github-stats.js"></script>
</body>
</html>
